name: Novidades no Discord

on:
  schedule:
    - cron: "17 * * * *"   # de hora a hora, ao minuto 17
  workflow_dispatch:
    inputs:
      teste:
        description: "URL(s) de produto para publicar como teste (separados por espaço). Vazio = execução normal."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: novidades
  cancel-in-progress: false

jobs:
  novidades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: bot
      - name: Estado (ramo estado-novidades)
        run: |
          git fetch origin estado-novidades:estado-novidades 2>/dev/null || true
          if git show-ref --quiet refs/heads/estado-novidades; then
            git worktree add estado estado-novidades
          else
            git worktree add --orphan -b estado-novidades estado
          fi
      - name: Procurar produtos novos
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TESTE: ${{ github.event.inputs.teste }}
        run: |
          if [ -n "$TESTE" ]; then
            python3 bot/novidades.py estado/vistos.json --teste $TESTE
          else
            python3 bot/novidades.py estado/vistos.json
          fi
      - name: Guardar estado
        if: ${{ github.event.inputs.teste == '' }}
        run: |
          cd estado
          git config user.name "Weatherlight Bot"
          git config user.email "noreply@github.com"
          git add vistos.json
          git diff --cached --quiet || (git commit -m "Produtos vistos: $(date -u +%F\ %H:%M)" && git push origin estado-novidades)
